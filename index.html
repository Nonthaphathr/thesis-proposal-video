<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>คลิปสรุปเค้าโครงวิทยานิพนธ์ บทที่ 1–3</title>


<style>
:root{--bg:#FFF4F1;--fg:#3E1830;--mut:#7A5568;--card:#FFFFFF;--line:#F0D3D9;--accent:#D93F6D;--accent-fg:#FFFFFF;--soft:#FFE8EC;--on:#FFD4DE;--ok:#2F7D5B;--no:#B4472F;--bar:#E9A9BA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#22101B;--fg:#FBE9EE;--mut:#C9A3B3;--card:#311927;--line:#4D2A3E;--accent:#F0628E;--accent-fg:#2A0E1B;--soft:#3A1D2C;--on:#5A2B40;--ok:#6CCB9D;--no:#F09A86;--bar:#8A4560;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#22101B;--fg:#FBE9EE;--mut:#C9A3B3;--card:#311927;--line:#4D2A3E;--accent:#F0628E;--accent-fg:#2A0E1B;--soft:#3A1D2C;--on:#5A2B40;--ok:#6CCB9D;--no:#F09A86;--bar:#8A4560;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:'Sarabun','Loma',sans-serif;font-size:17px;line-height:1.55;padding-inline:16px;padding-block:20px 48px}
.page{max-width:1240px;margin:0 auto}
h1,h2,h3,h4,button,summary,.lbl{font-family:'Prompt','Sarabun',sans-serif}
h1{font-size:clamp(22px,3.6vw,34px);line-height:1.2;margin:0 0 4px;font-weight:800;text-wrap:balance}
.sub{color:var(--mut);margin:0 0 16px;font-size:15.5px;text-wrap:balance}
.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
#player{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:#FFF7EE;box-shadow:0 6px 0 var(--line)}
#stagebtn{position:absolute;inset:0;z-index:200;background:transparent;border:0;cursor:pointer;width:100%;border-radius:0}
#startov{position:absolute;inset:0;z-index:210;display:grid;place-items:center;background:rgba(62,24,48,.28);border:0;border-radius:0;cursor:pointer;padding:0}
#startov span{display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:12px 26px;font-size:clamp(15px,2.4vw,20px);font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.18)}
#hot{position:absolute;right:10px;bottom:10px;z-index:220;background:var(--card);padding:5px 14px;font-size:14px;border-width:2px}
button{border:2px solid var(--fg);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 16px;font-size:15px;font-weight:700;cursor:pointer;line-height:1.3}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:14px}
button#play{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);min-width:104px}
#bar{flex:1 1 200px;min-width:0;accent-color:var(--accent);height:28px}
#time{font-variant-numeric:tabular-nums;color:var(--mut);font-size:15px;min-width:86px;text-align:right}
.ctl2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px}
.ctl2 button{font-size:14px;padding:4px 14px;border-width:1.5px}
.ctl2 button[aria-pressed="true"]{background:var(--on);border-color:var(--accent)}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#chips button{padding:3px 12px;font-size:14px;border-width:2px;border-color:var(--line)}
#chips button.on{background:var(--on);border-color:var(--accent)}
#panel{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px 16px 18px;min-width:0}
@media (min-width:981px){#panel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{border-width:2px;border-color:var(--line);padding:4px 16px;font-size:14.5px}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.nav button{padding:2px 12px;font-size:16px;border-width:1.5px}
.nav .ttl{flex:1;min-width:0}
.nav .no{font-size:13px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.nav h2{margin:0;font-size:19px;line-height:1.3;font-weight:800}
.follow{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--mut);margin:4px 0 12px}
.follow input{accent-color:var(--accent);width:18px;height:18px}
#body h4{margin:16px 0 4px;font-size:15px;color:var(--accent);letter-spacing:.02em}
#body p{margin:4px 0 8px}
#body dl{margin:8px 0;display:grid;gap:8px}
#body dt{font-family:'Prompt',sans-serif;font-size:13.5px;color:var(--mut)}
#body dd{margin:0}
#body ol{margin:6px 0 8px;padding-left:22px}
#body li{margin-bottom:4px}
details{border:1.5px solid var(--line);border-radius:10px;margin:8px 0;background:var(--bg)}
details[open]{border-color:var(--accent)}
summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:15.5px;line-height:1.4;list-style:none;display:flex;gap:8px;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary::before{content:'+';color:var(--accent);font-weight:800;width:14px;flex:none}
details[open]>summary::before{content:'−'}
details>div{padding:0 12px 12px 34px;font-size:16px}
.grp{font-family:'Prompt',sans-serif;font-size:13px;color:var(--mut);margin:10px 0 4px}
.chipw{display:flex;flex-wrap:wrap;gap:6px}
.chipw button{font-size:13.5px;padding:3px 11px;border-width:1.5px;border-color:var(--line);font-weight:500;text-align:left}
.chipw button[aria-pressed="true"]{background:var(--on);border-color:var(--accent);font-weight:700}
.scard{margin-top:8px;border-left:4px solid var(--accent);background:var(--soft);padding:10px 12px;border-radius:0 10px 10px 0;font-size:15.5px}
.scard .m{font-size:13px;color:var(--mut)}
.scard b{font-family:'Prompt',sans-serif}
.bars{display:grid;gap:8px;margin:8px 0}
.bars .r{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:2px 8px;align-items:center;font-size:15px}
.bars .t{grid-column:1/-1;position:relative;height:14px;background:var(--soft);border-radius:7px}
.bars .t i{display:block;height:100%;border-radius:7px;background:var(--accent)}
.bars .t i.no{background:var(--bar)}
.bars .t u{position:absolute;left:50%;top:-3px;bottom:-3px;border-left:2px dashed var(--fg);opacity:.55}
.bars .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.legend{font-size:13px;color:var(--mut)}
.two{display:grid;gap:10px;margin:8px 0}
.two>div{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
.two h5{margin:0 0 4px;font-family:'Prompt',sans-serif;font-size:14.5px;color:var(--accent)}
.two ul{margin:0;padding-left:20px;font-size:15.5px}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;min-width:430px;font-size:15px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-family:'Prompt',sans-serif;font-size:13px;color:var(--mut);font-weight:500}
tr.sel td{background:var(--on)}
tbody tr{cursor:pointer}
tfoot td{font-weight:700}
.tool{border:1.5px dashed var(--accent);border-radius:10px;padding:10px 12px;margin:10px 0}
.tool .lbl{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.04em}
.tool select{font:inherit;font-size:15px;background:var(--card);color:var(--fg);border:1.5px solid var(--line);border-radius:8px;padding:3px 6px}
.ex{display:flex;flex-wrap:wrap;gap:6px 10px;margin:8px 0}
.ex label{font-size:13px;color:var(--mut);display:grid;gap:2px}
.res{font-family:'Prompt',sans-serif;font-weight:700;font-size:16px;margin-top:6px}
.res.ok{color:var(--ok)}.res.no{color:var(--no)}
.tool input[type=range]{width:100%;accent-color:var(--accent)}
.band{display:grid;gap:3px;margin-top:8px;font-size:14.5px}
.band div{display:flex;justify-content:space-between;gap:8px;padding:2px 8px;border-radius:6px}
.band div.on{background:var(--on);font-weight:700}
.sc{border-bottom:1px solid var(--line);padding:10px 0}
.sc.on h3{color:var(--accent)}
.sc h3{margin:0 0 2px;font-size:15.5px}
.sc .tc{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.sc p{margin:4px 0 6px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{font-size:13px;padding:2px 12px;border-width:1.5px}
#fallback{width:100%;margin-top:10px;height:90px;font:inherit;background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:8px;padding:8px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:999;background:var(--fg);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;gap:10px;align-items:center;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:calc(100vw - 32px);white-space:nowrap}
#toast button{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);padding:3px 14px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
#aud{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#FFF7EE}
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Prompt:wght@500;600;700;800&family=Sarabun:wght@400;600;700&display=swap">

<div class="page">
  <h1>คลิปสรุปเค้าโครงวิทยานิพนธ์ บทที่ 1–3</h1>
  <p class="sub">ความสัมพันธ์ระหว่างความฉลาดทางอารมณ์ของผู้บริหารกับการทำงานเป็นทีมของครู · โรงเรียนสังกัด อบจ.ศรีสะเกษ · ความยาว 5 นาที 50 วินาที</p>
  <div class="layout">
    <div class="left">
      <div id="player"><video id="aud" playsinline preload="auto"></video><button id="stagebtn" aria-label="เล่นหรือหยุดวิดีโอ"></button><button id="startov" aria-label="เริ่มเล่นพร้อมเสียงบรรยาย"><span>▶ เริ่มเล่นพร้อมเสียงบรรยาย</span></button><button id="hot" hidden>ขยายความฉากนี้</button></div>
      <div class="ctl"><button id="play" aria-pressed="false">▶ เล่น</button><input id="bar" type="range" min="0" max="3500" value="0" aria-label="ตำแหน่งวิดีโอ"><span id="time">0:00 / 5:50</span></div>
      <div class="ctl2"><button id="mute" aria-pressed="false">เสียง: เปิด</button><button id="spd">ความเร็ว 1×</button><button id="auto" aria-pressed="true">หยุดอัตโนมัติเมื่อเปิดรายละเอียด: เปิด</button></div>
      <div id="chips" aria-label="ไปยังฉาก"></div>
    </div>
    <aside id="panel" aria-label="ขยายความและบทพูด">
      <div class="tabs" role="tablist"><button role="tab" id="tab1" aria-selected="true">ขยายความ</button><button role="tab" id="tab2" aria-selected="false">บทพูด</button></div>
      <div id="pane1">
        <div class="nav"><button id="prev" aria-label="ฉากก่อนหน้า">‹</button><div class="ttl"><div class="no" id="no"></div><h2 id="ptitle"></h2></div><button id="next" aria-label="ฉากถัดไป">›</button></div>
        <label class="follow"><input type="checkbox" id="follow" checked> ตามฉากที่กำลังเล่น</label>
        <div id="body"></div>
        <div class="row" style="margin-top:14px"><button id="goscene">เล่นจากฉากนี้</button></div>
      </div>
      <div id="pane2" hidden>
        <div class="row" style="margin-bottom:6px"><button id="copyall">คัดลอกบทพูดทั้งหมด</button></div>
        <div id="scripts"></div>
        <textarea id="fallback" hidden aria-label="ข้อความสำหรับคัดลอก"></textarea>
      </div>
    </aside>
  </div>
</div>

      case 'ol': return h + '<ol>' + b.items.map(x => `<li>${esc(x)}</li>`).join('') + '</ol>';
      case 'acc': return h + b.items.map((x, j) => `<details${b.open && j === 0 ? ' open' : ''}><summary>${esc(x[0])}</summary><div>${esc(x[1])}</div></details>`).join('');
      case 'src': return h + b.groups.map((g, gi) => `<div class="grp">${esc(g[0])}</div><div class="chipw">` + g[1].map((s, j) => `<button data-b="${bi}" data-g="${gi}" data-j="${j}" aria-pressed="false">${esc(s.n)} <span style="color:var(--mut)">${esc(s.y)}</span></button>`).join('') + '</div>').join('') + `<div class="scard" id="sc${bi}" hidden></div>`;
      case 'bars': return h + '<div class="bars">' + b.items.map(x => `<div class="r"><span>${esc(x[0])}</span><span class="v">${x[1]}%</span><div class="t"><i class="${x[2] ? '' : 'no'}" style="width:${x[1]}%"></i><u></u></div></div>`).join('') + '</div><div class="legend">เส้นประ = เกณฑ์ผ่านร้อยละ 50 · แท่งสีจาง = ไม่ผ่านเกณฑ์ จึงไม่นำมาเป็นองค์ประกอบ</div>';
      case 'two': return `<div class="two"><div><h5>${esc(b.a[0])}</h5><ul>${b.a[1].map(x => `<li>${esc(x)}</li>`).join('')}</ul></div><div><h5>${esc(b.b[0])}</h5><ul>${b.b[1].map(x => `<li>${esc(x)}</li>`).join('')}</ul></div></div>`;
      case 'ptable': {
        const R = [['ขนาดเล็ก', 3, 3, 35, 38, 3, 10, 13], ['ขนาดกลาง', 32, 32, 558, 590, 32, 151, 183], ['ขนาดใหญ่', 4, 4, 275, 279, 4, 74, 78]], T = ['รวม', 39, 39, 868, 907, 39, 235, 274];
        return `<h4>ประชากรและกลุ่มตัวอย่าง (ตารางที่ 3.1) · แตะแถวเพื่อดูอัตราสุ่ม</h4><div class="tw"><table><thead><tr><th rowspan="1">โรงเรียน</th><th>แห่ง</th><th>ผู้บริหาร</th><th>ครู</th><th>ประชากร</th><th>ตย. ผู้บริหาร</th><th>ตย. ครู</th><th>ตย. รวม</th></tr></thead><tbody>` +
          R.map((r, i) => `<tr data-r="${i}">${r.map(v => `<td>${v}</td>`).join('')}</tr>`).join('') + `</tbody><tfoot><tr>${T.map(v => `<td>${v}</td>`).join('')}</tr></tfoot></table></div><div class="legend" id="pnote">ตย. = กลุ่มตัวอย่าง · ผู้บริหารใช้ทั้งประชากร ส่วนครูสุ่มแบบแบ่งชั้นภูมิตามขนาดโรงเรียน</div>`;
      }
      case 'ioc': return `<div class="tool"><div class="lbl">ลองคำนวณ IOC (ตัวอย่างประกอบ ไม่ใช่ข้อมูลจริง)</div><p style="margin:4px 0">ผู้เชี่ยวชาญ 5 ท่านให้คะแนนข้อคำถามหนึ่งข้อ: +1 สอดคล้อง · 0 ไม่แน่ใจ · −1 ไม่สอดคล้อง</p><div class="ex">` +
          [1, 2, 3, 4, 5].map(i => `<label>ท่านที่ ${i}<select class="iocs"><option value="1">+1</option><option value="0">0</option><option value="-1">−1</option></select></label>`).join('') + `</div><div>IOC = ΣR ÷ N = <b id="iocv">1.00</b></div><div class="res ok" id="iocr">ผ่านเกณฑ์ (≥ 0.60) · คงข้อนี้ไว้</div></div>`;
      case 'meanr': return `<div class="tool"><div class="lbl">ลองแปลผลค่าเฉลี่ย</div><label style="font-size:15px">ค่าเฉลี่ย <b id="mv">3.80</b><input type="range" id="mi" min="1" max="5" step="0.01" value="3.8"></label><div class="band" id="mb"></div></div>` +
          `<div class="tool"><div class="lbl">ลองแปลผลสหสัมพันธ์ (เกณฑ์ฮินเคิล)</div><label style="font-size:15px">ค่า r <b id="rv">.65</b><input type="range" id="ri" min="0" max="1" step="0.01" value="0.65"></label><div class="band" id="rb"></div></div>`;
    }
    return '';
  }
  const MB = [[4.51, 'มากที่สุด'], [3.51, 'มาก'], [2.51, 'ปานกลาง'], [1.51, 'น้อย'], [1.0, 'น้อยที่สุด']];
  const MR = [['.90 – 1.00', 'สูงมาก', .9], ['.70 – .89', 'สูง', .7], ['.50 – .69', 'ปานกลาง', .5], ['.30 – .49', 'ต่ำ', .3], ['.00 – .29', 'ต่ำมาก', 0]];
  const MBr = ['4.51 – 5.00', '3.51 – 4.50', '2.51 – 3.50', '1.51 – 2.50', '1.00 – 1.50'];
  function wire(D){
    body.querySelectorAll('.chipw button').forEach(bt => bt.onclick = () => {
      const b = D.blocks[+bt.dataset.b], s = b.groups[+bt.dataset.g][1][+bt.dataset.j], card = $('sc' + bt.dataset.b), on = bt.getAttribute('aria-pressed') === 'true';
      body.querySelectorAll(`.chipw button[data-b="${bt.dataset.b}"]`).forEach(x => x.setAttribute('aria-pressed', 'false'));
      if(on){ card.hidden = true; return; }
      bt.setAttribute('aria-pressed', 'true'); card.hidden = false;
      card.innerHTML = `<b>${esc(s.n)}</b> <span class="m">(${esc(s.y)}) · ${esc(s.kind)} · ${esc(s.src)}</span>` + (s.t ? `<div style="margin-top:4px"><i>${esc(s.t)}</i></div>` : '') + `<div style="margin-top:4px">${esc(s.f)}</div>`;
    });
    const pt = body.querySelector('tbody'); if(pt) pt.onclick = e => { const tr = e.target.closest('tr'); if(!tr) return; pt.querySelectorAll('tr').forEach(r => r.classList.remove('sel')); tr.classList.add('sel');
      const c = tr.children; $('pnote').textContent = `${c[0].textContent}: ครู ${c[3].textContent} คน สุ่มมา ${c[6].textContent} คน (ร้อยละ ${(+c[6].textContent / +c[3].textContent * 100).toFixed(1)}) · ผู้บริหารใช้ทั้ง ${c[2].textContent} คน`; };
    const ss = body.querySelectorAll('.iocs');
    if(ss.length){ const up = () => { let sum = 0; ss.forEach(s => sum += +s.value); const v = sum / ss.length; $('iocv').textContent = v.toFixed(2); const ok = v >= .6; const r = $('iocr'); r.className = 'res ' + (ok ? 'ok' : 'no'); r.textContent = ok ? 'ผ่านเกณฑ์ (≥ 0.60) · คงข้อนี้ไว้' : 'ไม่ผ่านเกณฑ์ (< 0.60) · ต้องปรับหรือตัดข้อนี้'; }; ss.forEach(s => s.onchange = up); up(); }
    const mi = $('mi'); if(mi){
      const um = () => { const v = +mi.value; $('mv').textContent = v.toFixed(2); const k = MB.findIndex(x => v >= x[0] - 1e-9); $('mb').innerHTML = MB.map((x, i) => `<div class="${i === k ? 'on' : ''}"><span>${MBr[i]}</span><span>ระดับ${x[1]}</span></div>`).join(''); };
      const ur = () => { const v = +$('ri').value; $('rv').textContent = v >= 1 ? '1.00' : '.' + String(Math.round(v * 100)).padStart(2, '0'); const k = MR.findIndex(x => v >= x[2] - 1e-9); $('rb').innerHTML = MR.map((x, i) => `<div class="${i === k ? 'on' : ''}"><span>r ${x[0]}</span><span>สัมพันธ์${x[1]}</span></div>`).join(''); };
      mi.oninput = um; $('ri').oninput = ur; um(); ur();
    }
  }
  function showPanel(i){
    pi = Math.max(0, Math.min(N - 1, i)); const D = DETAIL[pi], s = SCRIPT[pi];
    $('no').textContent = `ฉากที่ ${pi + 1} จาก ${N} · ${fmt(s.t0)}–${fmt(s.t1)}`; $('ptitle').textContent = D.sum || s.title;
    body.innerHTML = D.blocks.map(renderBlock).join(''); wire(D); body.scrollTop = 0;
    $('prev').disabled = pi === 0; $('next').disabled = pi === N - 1; $('prev').style.opacity = pi === 0 ? .4 : 1; $('next').style.opacity = pi === N - 1 ? .4 : 1;
  }

  /* ---------- clock / transport ---------- */
  function ui(){
    bar.value = String(Math.round(t * 10)); tl.textContent = fmt(t) + ' / ' + fmt(TOTAL);
    const i = sceneAt(t);
    if(i !== cur){ cur = i; chips.querySelectorAll('button').forEach((b, k) => b.classList.toggle('on', k === cur)); document.querySelectorAll('.sc').forEach((e, k) => e.classList.toggle('on', k === cur)); if(follow) showPanel(cur); }
  }
  function frame(){ if(playing){ t = Math.min(TOTAL, aud.currentTime); } setTime(t); ui(); if(playing) requestAnimationFrame(frame); }
  function play(){ if(t >= TOTAL - .1){ t = 0; aud.currentTime = 0; } $('startov').hidden = true; $('hot').hidden = false; started = true; $('toast').hidden = true;
    aud.muted = muted; aud.playbackRate = speeds[si];
    const p = aud.play(); if(p && p.catch) p.catch(() => { playing = false; btn.textContent = '▶ เล่น'; });
    playing = true; btn.textContent = '❚❚ หยุด'; btn.setAttribute('aria-pressed', 'true'); requestAnimationFrame(frame); }
  function pause(){ playing = false; aud.pause(); btn.textContent = '▶ เล่น'; btn.setAttribute('aria-pressed', 'false'); }
  function seek(x){ t = Math.max(0, Math.min(TOTAL, x)); try { aud.currentTime = t; } catch(e){} setTime(t); ui(); }
  aud.addEventListener('ended', () => { if(playing){ t = TOTAL; pause(); setTime(t); ui(); } });
  const toggle = () => playing ? pause() : play();
  btn.onclick = toggle; $('stagebtn').onclick = toggle; $('startov').onclick = play;
  bar.oninput = () => seek(bar.value / 10);
  $('mute').onclick = e => { muted = !muted; aud.muted = muted; e.currentTarget.textContent = 'เสียง: ' + (muted ? 'ปิด' : 'เปิด'); e.currentTarget.setAttribute('aria-pressed', String(muted)); };
  $('spd').onclick = e => { si = (si + 1) % speeds.length; aud.playbackRate = speeds[si]; e.currentTarget.textContent = 'ความเร็ว ' + speeds[si] + '×'; };
  $('auto').onclick = e => { autoPause = !autoPause; e.currentTarget.setAttribute('aria-pressed', String(autoPause)); e.currentTarget.textContent = 'หยุดอัตโนมัติเมื่อเปิดรายละเอียด: ' + (autoPause ? 'เปิด' : 'ปิด'); };
  SCRIPT.forEach((s, k) => { const b = document.createElement('button'); b.textContent = k === 0 ? 'เปิด' : (k === N - 1 ? 'ปิด' : k); b.title = s.title; b.onclick = () => { follow = true; $('follow').checked = true; seek(s.t0 + .3); }; chips.appendChild(b); });

  /* ---------- panel interactions ---------- */
  function pausedForReading(){ if(playing && autoPause){ pause(); $('toast').hidden = false; } }
  body.addEventListener('pointerdown', e => { if(e.target.closest('summary,.chipw button,tbody tr,select,input')) pausedForReading(); });
  $('resume').onclick = play;
  $('follow').onchange = e => { follow = e.target.checked; if(follow) showPanel(cur); };
  $('prev').onclick = () => { follow = false; $('follow').checked = false; showPanel(pi - 1); };
  $('next').onclick = () => { follow = false; $('follow').checked = false; showPanel(pi + 1); };
  $('goscene').onclick = () => { follow = true; $('follow').checked = true; seek(SCRIPT[pi].t0 + .3); play(); };
  $('hot').onclick = () => { pausedForReading(); if(!playing && !$('toast').hidden === false){} follow = true; $('follow').checked = true; showPanel(cur); $('tab1').click(); if(innerWidth <= 980) $('panel').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  const tabs = [$('tab1'), $('tab2')], panes = [$('pane1'), $('pane2')];
  tabs.forEach((tb, k) => tb.onclick = () => { tabs.forEach((x, j) => { x.setAttribute('aria-selected', String(j === k)); panes[j].hidden = j !== k; }); });

  /* ---------- transcript ---------- */
  const list = $('scripts');
  SCRIPT.forEach((s, k) => { const d = document.createElement('article'); d.className = 'sc';
    d.innerHTML = `<h3>${k + 1}. ${esc(s.title)}</h3><div class="tc">${fmt(s.t0)}–${fmt(s.t1)}</div><p>${esc(s.text)}</p><div class="row"><button data-k="${k}" class="cp">คัดลอกฉากนี้</button><button data-j="${k}" class="go">เล่นฉากนี้</button></div>`; list.appendChild(d); });
  function copy(text, el){ const o = el.textContent, done = () => { el.textContent = 'คัดลอกแล้ว'; setTimeout(() => el.textContent = o, 1400); };
    const sel = () => { const ta = $('fallback'); ta.hidden = false; ta.value = text; ta.focus(); ta.select(); try { document.execCommand('copy'); done(); } catch(e){} };
    try { navigator.clipboard.writeText(text).then(done, sel); } catch(e){ sel(); } }
  list.addEventListener('click', e => { const c = e.target.closest('.cp'), g = e.target.closest('.go'); if(c) copy(SCRIPT[+c.dataset.k].text, c); if(g){ follow = true; $('follow').checked = true; seek(SCRIPT[+g.dataset.j].t0 + .3); play(); } });
  $('copyall').onclick = e => copy(SCRIPT.map(s => s.text).join('\n\n'), e.currentTarget);

  window.__seek = seek; cur = -1; t = 0; ui(); showPanel(cur < 0 ? 0 : cur);
  document.querySelectorAll('.sc').forEach((e, k) => e.classList.toggle('on', k === cur));
})();
</script>

<script>(async function(){const v=document.getElementById('aud'),o=document.getElementById('startov');const sp=o&&o.querySelector('span');const old=sp&&sp.textContent;if(sp)sp.textContent='กำลังโหลดวิดีโอ…';o.disabled=true;try{const ps=await Promise.all([0,1,2,3,4,5,6,7,8].map(i=>fetch('v'+i+'.bin').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()})));v.src=URL.createObjectURL(new Blob(ps,{type:'video/mp4'}));}catch(e){v.src='video.mp4';}if(sp)sp.textContent=old;o.disabled=false;})();</script>
